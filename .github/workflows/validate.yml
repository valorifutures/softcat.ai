name: Validate PR build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# An updated PR only needs checks for its current revision. Keep separate PRs
# independent, and retain every validation step below.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  recovery:
    uses: ./.github/workflows/research-recovery-check.yml
    permissions:
      contents: read

  build:
    needs: recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/validate-tools-data.mjs
      - run: node scripts/validate-content.mjs
      - run: node --test scripts/tests/*.test.mjs
      - run: node scripts/validate-horizon-refs.mjs
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline publication gate
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python scripts/validate-built-site.py
      - name: Bot unit tests
        run: |
          pip install -q pytest httpx python-dotenv feedparser anthropic
          python -m pytest bot/tests/ -q
