name: feral

on:
  schedule:
    - cron: "0 7 * * 2,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish a passing cycle or leave its PR for review"
        type: choice
        default: propose
        options: [propose, ship]

# Only one council at a time. A new trigger must not cancel paid work.
concurrency:
  group: feral-cycle
  cancel-in-progress: false

permissions:
  contents: read

env:
  FERAL_MODE: ${{ github.event.inputs.mode || 'ship' }}
  FERAL_MAX_TURNS: "60"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail before a paid model call if the shared site is already broken.
      - name: Baseline checks
        run: |
          node scripts/validate-content.mjs
          node scripts/validate-tools-data.mjs
          node scripts/validate-horizon-refs.mjs
          node --test scripts/tests/*.test.mjs
          npm run build
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code
      - name: Run the council
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "/feral-cycle" \
            --dangerously-skip-permissions \
            --max-turns "${FERAL_MAX_TURNS}" \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash,Task"
      - name: Save candidate for independent validation
        id: candidate
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          git config user.name feral-council
          git config user.email feral@softcat.ai
          git add -A
          TREE="$(git write-tree)"
          if [ "$TREE" = "$(git rev-parse "$BASE_SHA^{tree}")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # One candidate commit, always based on the checked starting commit.
          CANDIDATE="$(git commit-tree "$TREE" -p "$BASE_SHA" -m "feral: cycle $GITHUB_RUN_ID")"
          git update-ref refs/heads/feral-candidate "$CANDIDATE"
          git bundle create "$RUNNER_TEMP/feral-candidate.bundle" "$BASE_SHA..refs/heads/feral-candidate"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
      - name: Keep candidate, including candidates later rejected by the gate
        if: steps.candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: feral-candidate
          path: ${{ runner.temp }}/feral-candidate.bundle
          retention-days: 14

  validate:
    needs: council
    if: needs.council.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: feral-candidate
          path: ${{ runner.temp }}/feral-input
      - name: Check candidate using the trusted base gate
        env:
          BASE_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ needs.council.outputs.candidate_sha }}
        run: |
          git fetch "$RUNNER_TEMP/feral-input/feral-candidate.bundle" refs/heads/feral-candidate:refs/heads/feral-candidate
          test "$(git rev-parse feral-candidate)" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%P "$CANDIDATE_SHA")" = "$BASE_SHA"
          node scripts/feral-gate.mjs "$BASE_SHA" "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
      - run: npm ci
      - name: Candidate checks
        run: |
          node scripts/validate-content.mjs
          node scripts/validate-tools-data.mjs
          node scripts/validate-horizon-refs.mjs
          node --test scripts/tests/*.test.mjs
          npm run build
      - name: Save the checked Pages output
        if: env.FERAL_MODE == 'ship'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publish:
    needs: [council, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job runs no generated source, npm scripts or model calls.
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: feral-candidate
          path: ${{ runner.temp }}/feral-input
      - name: Publish the checked candidate
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ needs.council.outputs.candidate_sha }}
        run: |
          git fetch "$RUNNER_TEMP/feral-input/feral-candidate.bundle" refs/heads/feral-candidate:refs/heads/feral-candidate
          test "$(git rev-parse feral-candidate)" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%P "$CANDIDATE_SHA")" = "$BASE_SHA"
          gh auth setup-git
          CYCLE_BRANCH="feral/cycle-$GITHUB_RUN_ID"
          git push origin "$CANDIDATE_SHA:refs/heads/$CYCLE_BRANCH"
          cat > "$RUNNER_TEMP/feral-pr.md" <<'BODY'
          An autonomous Feral cycle with a new critic PASS. The trusted base gate verified the file scope and preserved ledger history. Content, model data, Horizon references, JavaScript tests and the production build passed in a separate job without repository write permission.

          The candidate branch is retained if publication fails. Ship mode advances main only when this checked candidate is a fast-forward. A concurrent main change needs a fresh validation run.
          BODY
          PR_URL="$(gh pr create --base main --head "$CYCLE_BRANCH" --title "feral: cycle $GITHUB_RUN_ID" --body-file "$RUNNER_TEMP/feral-pr.md")"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FERAL_MODE" = "ship" ]; then
            # No force push. A concurrent main update or branch rule blocks this.
            # GitHub marks the PR merged when main contains its candidate commit.
            git push origin "$CANDIDATE_SHA:refs/heads/main"
            echo "shipped=true" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes do not trigger deploy.yml. Publish the exact output
      # already built in the read-only validation job, without rebuilding here.
      - id: deployment
        if: steps.publish.outputs.shipped == 'true'
        uses: actions/deploy-pages@v5
