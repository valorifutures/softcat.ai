name: Report a bug
description: A broken tool, page or interaction.
title: 'Bug: '
body:
  - type: markdown
    attributes:
      value: 'Use a small, redacted example. This issue will be public. Leave out API keys and private conversations.'
  - type: input
    id: page
    attributes:
      label: Page or tool
      description: Paste the SOFT CAT page URL.
      placeholder: https://softcat.ai/lab/json-validator
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you try?
      description: Include the steps and a small example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox on Android, or Safari on macOS
